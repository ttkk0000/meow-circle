<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc"><title id="title">M&amp;D 宠友圈三条规则流程</title><desc id="desc">好友确认、图文发布与隐私收紧三个流程。推荐设计草案，尚未实施。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#616771"/></marker></defs><rect width="1440" height="1030" fill="#F7F8FA"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="48" y="57" font-size="30" font-weight="700" fill="#202329">M&amp;D · 宠友圈流程与边界</text><text x="48" y="91" font-size="16" fill="#616771">2026-10-16 · 图文首版 · 推荐草案，非运行系统</text><text x="48" y="153" font-size="23" font-weight="700" fill="#202329">01 · 成为宠友：关注与好友分开</text><text x="48" y="187" font-size="16" fill="#616771">只有接受才成为朋友；不读取通讯录、不自动关联微信好友。</text><rect x="48" y="216" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="68" y="252" font-size="20" font-weight="700" fill="#9E382A">发起请求</text><text x="68" y="289" font-size="16" fill="#202329">从公开主页主动添加</text><text x="68" y="322" font-size="15" fill="#616771">未确认前不开放圈内容</text><line x1="360" y1="283" x2="382" y2="283" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="396" y="216" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="416" y="252" font-size="20" font-weight="700" fill="#9E382A">对方决定</text><text x="416" y="289" font-size="16" fill="#202329">接受／暂不接受</text><text x="416" y="322" font-size="15" fill="#616771">发送者可撤回待处理请求</text><line x1="708" y1="283" x2="730" y2="283" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="744" y="216" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="764" y="252" font-size="20" font-weight="700" fill="#9E382A">双方成为宠友</text><text x="764" y="289" font-size="16" fill="#202329">时间流显示可见日常</text><text x="764" y="322" font-size="15" fill="#616771">新好友不默认读取旧动态</text><line x1="1056" y1="283" x2="1078" y2="283" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="1092" y="216" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="1112" y="252" font-size="20" font-weight="700" fill="#9E382A">关系变化</text><text x="1112" y="289" font-size="16" fill="#202329">移除与拉黑分别确认</text><text x="1112" y="322" font-size="15" fill="#616771">旧内容按当前权限重查</text><text x="48" y="449" font-size="23" font-weight="700" fill="#202329">02 · 发日常：公开范围先确认</text><text x="48" y="483" font-size="16" fill="#616771">日记按宠物归档，圈子按朋友阅读；同一内容不能被两个入口放大权限。</text><rect x="48" y="512" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="68" y="548" font-size="20" font-weight="700" fill="#9E382A">写图文</text><text x="68" y="585" font-size="16" fill="#202329">选择照片与可选宠物</text><text x="68" y="618" font-size="15" fill="#616771">首版无视频、无自动定位</text><line x1="360" y1="579" x2="382" y2="579" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="396" y="512" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="416" y="548" font-size="20" font-weight="700" fill="#9E382A">选择谁可以看</text><text x="416" y="585" font-size="16" fill="#202329">朋友／仅自己／指定范围</text><text x="416" y="618" font-size="15" fill="#616771">公开到社区另行确认</text><line x1="708" y1="579" x2="730" y2="579" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="744" y="512" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="764" y="548" font-size="20" font-weight="700" fill="#9E382A">预览再发布</text><text x="764" y="585" font-size="16" fill="#202329">看清文字、照片与身份</text><text x="764" y="618" font-size="15" fill="#616771">私密档案不被自动公开</text><line x1="1056" y1="579" x2="1078" y2="579" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="1092" y="512" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="1112" y="548" font-size="20" font-weight="700" fill="#9E382A">完成或恢复</text><text x="1112" y="585" font-size="16" fill="#202329">成功回到新动态</text><text x="1112" y="618" font-size="15" fill="#616771">失败保留草稿并可重试</text><text x="48" y="745" font-size="23" font-weight="700" fill="#202329">03 · 收紧隐私：所有入口一致</text><text x="48" y="779" font-size="16" fill="#616771">只能阻止后续读取，不能承诺召回已截图或已显示过的系统通知。</text><rect x="48" y="808" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="68" y="844" font-size="20" font-weight="700" fill="#9E382A">改为仅自己</text><text x="68" y="881" font-size="16" fill="#202329">作者明确确认影响</text><text x="68" y="914" font-size="15" fill="#616771">不改写他人评论原文</text><line x1="360" y1="875" x2="382" y2="875" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="396" y="808" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="416" y="844" font-size="20" font-weight="700" fill="#9E382A">隐藏内容入口</text><text x="416" y="881" font-size="16" fill="#202329">圈子／主页／搜索更新</text><text x="416" y="914" font-size="15" fill="#616771">详情和照片链接重查</text><line x1="708" y1="875" x2="730" y2="875" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="744" y="808" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="764" y="844" font-size="20" font-weight="700" fill="#9E382A">处理旧通知</text><text x="764" y="881" font-size="16" fill="#202329">不继续显示私密摘要</text><text x="764" y="914" font-size="15" fill="#616771">隐藏昵称、引用与缩略图</text><line x1="1056" y1="875" x2="1078" y2="875" stroke="#616771" stroke-width="2" marker-end="url(#arrow)"/><rect x="1092" y="808" width="300" height="135" rx="16" fill="#FFFEFC" stroke="#E0E3E8"/><text x="1112" y="844" font-size="20" font-weight="700" fill="#9E382A">保留安全出口</text><text x="1112" y="881" font-size="16" fill="#202329">中性提示暂不可见</text><text x="1112" y="914" font-size="15" fill="#616771">举报与必要复核独立</text><text x="48" y="1000" font-size="14" fill="#616771">制作范围：设计方案与视觉提案；Figma 原生同步、真实输入／发布／消息和设备验收尚未完成。</text></g></svg>
