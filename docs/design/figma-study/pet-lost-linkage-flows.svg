<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">M&amp;D 自有宠物走失联动流程</title>
<desc id="desc">从本人确认宠物走失、独立公开求助授权，经列表地图、主动分享与订阅提醒，处理私密线索，最后由主人确认找回并结束；个人状态不等于自动广播，其他结束不等于找回。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#616771" stroke-width="1.5"/></marker>
<style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}.title{font-size:32px;font-weight:700;fill:#202329}.sub{font-size:18px;fill:#616771}.lane{font-size:22px;font-weight:700;fill:#202329}.cardTitle{font-size:21px;font-weight:700;fill:#202329}.body{font-size:18px;fill:#3D434B}.note{font-size:17px;fill:#616771}.normal{fill:#FFFEFC;stroke:#CBD0D7;stroke-width:1.5}.accent{fill:#FFF1EB;stroke:#C84B3D;stroke-width:1.5}.success{fill:#E8F4ED;stroke:#176C49;stroke-width:1.5}.connector{fill:none;stroke:#616771;stroke-width:2}</style></defs>
<rect width="1600" height="1280" fill="#F7F8FA"/>
<text x="40" y="60" class="title">M&amp;D · 从自己的宠物，到完整找宠闭环</text>
<text x="40" y="94" class="sub">2026-10-16 · 可评审设计草案，未同步 Figma 原生原型 · 猫咪优先，狗狗和其他宠物共用规则</text>
<text x="40" y="150" class="lane">01 先确认个人状态，再选择是否对外求助</text><g transform="translate(40 176)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">自己的宠物主页</text><text x="20" y="68" class="body">选择正确宠物 → 标记走失</text><text x="20" y="93" class="body">预填已有资料，不猜时间地点</text><text x="20" y="118" class="body">取消确认：不更改状态</text></g><g transform="translate(430 176)"><rect width="350" height="154" rx="16" class="accent"/><text x="20" y="36" class="cardTitle">确认影响与选择</text><text x="20" y="68" class="body">仅修改状态／继续求助／取消</text><text x="20" y="93" class="body">本人明确确认才保存走失</text><text x="20" y="118" class="body">不是点击即公开</text></g><g transform="translate(820 176)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">个人走失状态已保存</text><text x="20" y="68" class="body">原档案权限不变</text><text x="20" y="93" class="body">可选择暂不发布公开求助</text><text x="20" y="118" class="body">放弃草稿不撤销已确认状态</text></g><g transform="translate(1210 176)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">填写、预览并提交</text><text x="20" y="68" class="body">本次时间、粗略区域、照片</text><text x="20" y="93" class="body">逐项确认公开范围与渠道</text><text x="20" y="118" class="body">待审核不等于已向别人分发</text></g><path d="M398 252H420" class="connector" marker-end="url(#arrow)"/><path d="M788 252H810" class="connector" marker-end="url(#arrow)"/><path d="M1178 252H1200" class="connector" marker-end="url(#arrow)"/><text x="40" y="374" class="note">分离四项授权：个人状态 ≠ 公开求助 ≠ 分享给朋友 ≠ 接收附近提醒；同一宠物只保留一个活跃事件。</text>
<text x="40" y="433" class="lane">02 同一案例按各自授权联动（下列是并列入口，不是自动群发）</text><g transform="translate(40 460)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">互助列表／地图</text><text x="20" y="68" class="body">经同意且满足展示条件后</text><text x="20" y="93" class="body">公开粗略区域和最后见到时间</text><text x="20" y="118" class="body">不代表实时位置或逃跑轨迹</text></g><g transform="translate(430 460)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">宠友圈分享卡</text><text x="20" y="68" class="body">主人主动选择受众后分享</text><text x="20" y="93" class="body">只含经确认的案例摘要</text><text x="20" y="118" class="body">私密宠物档案不会跟着公开</text></g><g transform="translate(820 460)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">群聊／私信分享卡</text><text x="20" y="68" class="body">用户选择会话并确认发送</text><text x="20" y="93" class="body">不自动建群、不群发</text><text x="20" y="118" class="body">会话规则与消息请求仍生效</text></g><g transform="translate(1210 460)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">5–100 公里附近提醒</text><text x="20" y="68" class="body">接收者主动订阅才参与</text><text x="20" y="93" class="body">按中心、物种、频率等判断</text><text x="20" y="118" class="body">可关闭；不默认后台跟踪</text></g><text x="40" y="660" class="note">所有入口引用本次 case ID：更新、收紧权限和结案时重新读取同一事件；新照片和普通评论不逐条触发广播。</text>
<text x="40" y="716" class="lane">03 目击信息进入私密线索，不把“相似”当作已找到</text><g transform="translate(40 742)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">看到疑似宠物</text><text x="20" y="68" class="body">主动选择“我可能见过它”</text><text x="20" y="93" class="body">时间、地点、可选照片</text><text x="20" y="118" class="body">普通评论不自动转线索</text></g><g transform="translate(430 742)"><rect width="350" height="154" rx="16" class="accent"/><text x="20" y="36" class="cardTitle">私密提交与回执</text><text x="20" y="68" class="body">仅主人及授权人员可查看</text><text x="20" y="93" class="body">通知不带精确地点和原图</text><text x="20" y="118" class="body">回执只表示收到</text></g><g transform="translate(820 742)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">主人核实与联系</text><text x="20" y="68" class="body">待核实／有帮助／不匹配</text><text x="20" y="93" class="body">保持原始描述，独立举报</text><text x="20" y="118" class="body">不按爱心数或举报数判真假</text></g><g transform="translate(1210 742)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">更新寻找进展</text><text x="20" y="68" class="body">可补图、更正、暂停展示</text><text x="20" y="93" class="body">疑似目击不移动公共主标记</text><text x="20" y="118" class="body">第三方不能代主人宣布找回</text></g><path d="M398 818H420" class="connector" marker-end="url(#arrow)"/><path d="M788 818H810" class="connector" marker-end="url(#arrow)"/><path d="M1178 818H1200" class="connector" marker-end="url(#arrow)"/><text x="40" y="952" class="lane">04 主人确认接回 → 停止本次提醒 → 全入口更新</text><g transform="translate(40 978)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">确认已接回</text><text x="20" y="68" class="body">先阅读影响，再明确确认</text><text x="20" y="93" class="body">未确认不提交；不强迫公开图</text><text x="20" y="118" class="body">误标／其他结束另走分支</text></g><g transform="translate(430 978)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">结束处理中</text><text x="20" y="68" class="body">停止新增及排队的本次警报</text><text x="20" y="93" class="body">安全重试，不重复创建事件</text><text x="20" y="118" class="body">未同步完不能假装全部完成</text></g><g transform="translate(820 978)"><rect width="350" height="154" rx="16" class="success"/><text x="20" y="36" class="cardTitle">已找回／恢复在家</text><text x="20" y="68" class="body">退出活跃列表和地图</text><text x="20" y="93" class="body">历史站内卡显示已找回</text><text x="20" y="118" class="body">关闭公共联系，线索仍受限</text></g><g transform="translate(1210 978)"><rect width="350" height="154" rx="16" class="normal"/><text x="20" y="36" class="cardTitle">可选分享团圆日记</text><text x="20" y="68" class="body">不自动发圈或向全城报喜</text><text x="20" y="93" class="body">截图与旧锁屏通知无法召回</text><text x="20" y="118" class="body">再次走失：重新建立新事件</text></g><path d="M398 1054H420" class="connector" marker-end="url(#arrow)"/><path d="M788 1054H810" class="connector" marker-end="url(#arrow)"/><path d="M1178 1054H1200" class="connector" marker-end="url(#arrow)"/><text x="40" y="1182" class="note">其他结束不等于找回；长期未更新不等于找回；隐藏违规内容不等于找回。平台审核与主人事实确认分开。</text>
<text x="40" y="1213" class="note">当前为设计提案，未触发真实定位、发布、推送、爬虫、会话或权限变更；18 个待创建场景不计入已有 134 状态原型。</text>
<text x="40" y="1250" class="sub">M&amp;D / meow &amp; doggie · 详细规则见 PET_LOST_LINKAGE_BRIEF.md</text></svg>
