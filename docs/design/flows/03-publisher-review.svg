<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">03  发布方与材料审核</title><desc id="f03-desc">发布者提交主体与授权，建立单猫档案，披露当前照护、来源、代理、接待、预计收款与费用。平台审阅材料，通过后公开分项结论。缺项补充、异常暂停，关键变化或证据过期进入复核。</desc>
<defs><marker id="f03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="1050" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">03  发布方与材料审核</text><text x="40" y="106" class="subtitle">核对适用主体与授权，披露每只猫的实际关系；商家和代理不会因身份被一概拒绝。</text>
<path d="M360 260 V310" class="edge" marker-end="url(#f03-arrow)"/><path d="M360 420 V470" class="edge" marker-end="url(#f03-arrow)"/><path d="M360 580 V630" class="edge" marker-end="url(#f03-arrow)"/><path d="M360 740 V790" class="edge" marker-end="url(#f03-arrow)"/><path d="M660 525 H840" class="edge dashed" marker-end="url(#f03-arrow)"/><text x="690" y="505" class="edge-label">缺项 / 授权不清</text><path d="M990 470 V285 H690 V365 H660" class="edge dashed" marker-end="url(#f03-arrow)"/><text x="815" y="280" class="edge-label">补充后重提</text><path d="M660 685 H840" class="edge dashed" marker-end="url(#f03-arrow)"/><text x="680" y="665" class="edge-label">冒用 / 隐瞒 / 争议</text><path d="M660 845 H775 V740 H990" class="edge dashed" marker-end="url(#f03-arrow)"/><text x="790" y="820" class="edge-label">过期 / 关键变化</text><g class="node" data-node="f03-identity" role="group" aria-labelledby="f03-identity-title f03-identity-desc"><title id="f03-identity-title">提交适用主体、代表人员与授权 / 个人 / 商家 / 猫舍 / 救助 / 披露代理</title><desc id="f03-identity-desc">核对账号与主体，以及代表人员和发布者的权限。主体类型、对猫的关系、证据结论分别管理。</desc><rect x="60" y="150" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="177" class="role">01 · 发布者</text><text x="82" y="208" class="label" font-size="22"><tspan x="82" dy="0">提交适用主体、代表人员与授权</tspan><tspan x="82" dy="28">个人 / 商家 / 猫舍 / 救助 / 披露代理</tspan></text></g><g class="node" data-node="f03-pet" role="group" aria-labelledby="f03-pet-title f03-pet-desc"><title id="f03-pet-title">建立单猫档案与商业 / 领养性质 / 披露照护、来源、接待、预计收款和代理</title><desc id="f03-pet-desc">来源未知如实标记；主体可以不同，但关系和责任须可解释。价格包括具体猫、全部必付项和代理费用。</desc><rect x="60" y="310" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="337" class="role">02 · 发布者</text><text x="82" y="368" class="label" font-size="22"><tspan x="82" dy="0">建立单猫档案与商业 / 领养性质</tspan><tspan x="82" dy="28">披露照护、来源、接待、预计收款和代理</tspan></text></g><g class="node" data-node="f03-review" role="group" aria-labelledby="f03-review-title f03-review-desc"><title id="f03-review-title">逐项审阅主体 / 授权 / 近期材料 / 记录对象、方法、时间和版本</title><desc id="f03-review-desc">近期视频支持有限的猫与环境接触信息；医疗文件上传与向出具方确认应分别展示。</desc><rect x="60" y="470" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="82" y="497" class="role">03 · 平台审核人员</text><text x="82" y="528" class="label" font-size="22"><tspan x="82" dy="0">逐项审阅主体 / 授权 / 近期材料</tspan><tspan x="82" dy="28">记录对象、方法、时间和版本</tspan></text></g><g class="node" data-node="f03-publish" role="group" aria-labelledby="f03-publish-title f03-publish-desc"><title id="f03-publish-title">通过适用审核后公开 / 展示脱敏披露与分项核验摘要</title><desc id="f03-publish-desc">不提供全局真实、健康或无中介认证。商业信息应满足适用的经营公示要求；私人地址按预约权限展示。</desc><rect x="60" y="630" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="657" class="role">04 · 平台与发布者</text><text x="82" y="688" class="label" font-size="22"><tspan x="82" dy="0">通过适用审核后公开</tspan><tspan x="82" dy="28">展示脱敏披露与分项核验摘要</tspan></text></g><g class="node" data-node="f03-maintain" role="group" aria-labelledby="f03-maintain-title f03-maintain-desc"><title id="f03-maintain-title">更新可用状态与材料时效 / 关键变化重审，旧预约快照保留</title><desc id="f03-maintain-desc">已发布信息更新不能覆盖历史版本；关键关系或证据失效需复核并通知相关用户，期间可限制新增预约。</desc><rect x="60" y="790" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="817" class="role">05 · 发布者持续维护</text><text x="82" y="848" class="label" font-size="22"><tspan x="82" dy="0">更新可用状态与材料时效</tspan><tspan x="82" dy="28">关键变化重审，旧预约快照保留</tspan></text></g><g class="node" data-node="f03-supplement" role="group" aria-labelledby="f03-supplement-title f03-supplement-desc"><title id="f03-supplement-title">看到具体缺项与原因 / 补材料 / 撤回草稿</title><desc id="f03-supplement-desc">未上传不等于审核失败。可以补充、采用人工视频等替代方式或撤回，不要求暴露整屋和家庭成员。</desc><rect x="840" y="470" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="497" class="role">补充出口 · 发布者</text><text x="862" y="528" class="label" font-size="19"><tspan x="862" dy="0">看到具体缺项与原因</tspan><tspan x="862" dy="28">补材料 / 撤回草稿</tspan></text></g><g class="node" data-node="f03-suspend" role="group" aria-labelledby="f03-suspend-title f03-suspend-desc"><title id="f03-suspend-title">暂停或限制新增预约 / 告知原因，可复核申诉</title><desc id="f03-suspend-desc">主体冒用、授权失效或有据风险可暂停。高频、多猫、同一门店或代理身份只作线索，不自动认定欺骗。</desc><rect x="840" y="630" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="657" class="role">异常出口 · 平台</text><text x="862" y="688" class="label" font-size="19"><tspan x="862" dy="0">暂停或限制新增预约</tspan><tspan x="862" dy="28">告知原因，可复核申诉</tspan></text></g>
<line x1="40" y1="992" x2="1160" y2="992" stroke="#F1D8C8"/><text x="40" y="1022" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
