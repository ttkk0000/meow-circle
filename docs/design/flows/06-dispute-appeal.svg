<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1240" width="1200" height="1240" role="img" aria-labelledby="f06-title f06-desc">
<title id="f06-title">06  举报、复核与申诉</title><desc id="f06-desc">任何用户可举报，有无预约码均可。平台先受理为待核实，比较材料、预约版本和双方说明，必要时采取临时措施。作出报告获支持、未获支持或无法判断的结论，告知理由并接受申诉；补充材料后复核，保留改判与结案记录。</desc>
<defs><marker id="f06-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="1240" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">06  举报、复核与申诉</text><text x="40" y="106" class="subtitle">投诉资格与公开评价依据分开；缺少预约码仍可受理，结论按证据区分。</text>
<path d="M600 260 V310" class="edge" marker-end="url(#f06-arrow)"/><path d="M600 420 V470" class="edge" marker-end="url(#f06-arrow)"/><path d="M600 580 V615 H210 V650" class="edge" marker-end="url(#f06-arrow)"/><path d="M600 580 V650" class="edge" marker-end="url(#f06-arrow)"/><path d="M600 580 V615 H990 V650" class="edge" marker-end="url(#f06-arrow)"/><path d="M210 760 V815 H600 V850" class="edge" marker-end="url(#f06-arrow)"/><path d="M600 760 V850" class="edge" marker-end="url(#f06-arrow)"/><path d="M990 760 V815 H600 V850" class="edge" marker-end="url(#f06-arrow)"/><path d="M600 960 V1010" class="edge" marker-end="url(#f06-arrow)"/><path d="M300 1065 H85 V525 H300" class="edge dashed" marker-end="url(#f06-arrow)"/><text x="95" y="805" class="edge-label">补充材料后复核</text><g class="node" data-node="f06-report" role="group" aria-labelledby="f06-report-title f06-report-desc"><title id="f06-report-title">选择不符类别并提供必要说明 / 无预约码 / 未成交也可举报</title><desc id="f06-report-desc">身份、猫、地点、费用、代理、健康声明与骚扰等均有类别。受理不以成交、付款或到访码为前提。</desc><rect x="300" y="150" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="322" y="177" class="role">01 · 举报用户</text><text x="322" y="208" class="label" font-size="22"><tspan x="322" dy="0">选择不符类别并提供必要说明</tspan><tspan x="322" dy="28">无预约码 / 未成交也可举报</tspan></text></g><g class="node" data-node="f06-receive" role="group" aria-labelledby="f06-receive-title f06-receive-desc"><title id="f06-receive-title">创建编号：待核实 / 必要时临时限制，说明原因</title><desc id="f06-receive-desc">对有据风险可暂时限制新增预约或隐藏内容；临时措施不是最终定罪，提供补充通道。</desc><rect x="300" y="310" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="322" y="337" class="role">02 · 平台受理</text><text x="322" y="368" class="label" font-size="22"><tspan x="322" dy="0">创建编号：待核实</tspan><tspan x="322" dy="28">必要时临时限制，说明原因</tspan></text></g><g class="node" data-node="f06-evidence" role="group" aria-labelledby="f06-evidence-title f06-evidence-desc"><title id="f06-evidence-title">比较原声明、版本、材料与双方说明 / 记录依据，不公开证件与私人地址</title><desc id="f06-evidence-desc">举报数量不代替事实，单方说法不直接标骗子；缺记录时仍审阅适用证据，也允许无法判断。</desc><rect x="300" y="470" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="322" y="497" class="role">03 · 授权审核人员</text><text x="322" y="528" class="label" font-size="22"><tspan x="322" dy="0">比较原声明、版本、材料与双方说明</tspan><tspan x="322" dy="28">记录依据，不公开证件与私人地址</tspan></text></g><g class="node" data-node="f06-upheld" role="group" aria-labelledby="f06-upheld-title f06-upheld-desc"><title id="f06-upheld-title">报告获支持 / 有据处置与必要说明</title><desc id="f06-upheld-desc">说明哪些事项不符、依据和采取的动作；不扩大成无法证明的全局欺骗结论。</desc><rect x="40" y="650" width="340" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="62" y="677" class="role">结论 A · 平台</text><text x="62" y="708" class="label" font-size="19"><tspan x="62" dy="0">报告获支持</tspan><tspan x="62" dy="28">有据处置与必要说明</tspan></text></g><g class="node" data-node="f06-dismissed" role="group" aria-labelledby="f06-dismissed-title f06-dismissed-desc"><title id="f06-dismissed-title">报告未获支持 / 说明核对范围与理由</title><desc id="f06-dismissed-desc">报告未获支持仅描述本次材料与核对结果，不证明没有欺骗，不为所有历史或未来行为保证。</desc><rect x="430" y="650" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="452" y="677" class="role">结论 B · 平台</text><text x="452" y="708" class="label" font-size="19"><tspan x="452" dy="0">报告未获支持</tspan><tspan x="452" dy="28">说明核对范围与理由</tspan></text></g><g class="node" data-node="f06-unknown" role="group" aria-labelledby="f06-unknown-title f06-unknown-desc"><title id="f06-unknown-title">无法判断 / 说明缺证与补充路径</title><desc id="f06-unknown-desc">无法判断单独记录，不归为报告未获支持。可保留必要风险控制，但不能公开当作已确认违规。</desc><rect x="820" y="650" width="340" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="842" y="677" class="role">结论 C · 平台</text><text x="842" y="708" class="label" font-size="19"><tspan x="842" dy="0">无法判断</tspan><tspan x="842" dy="28">说明缺证与补充路径</tspan></text></g><g class="node" data-node="f06-notify" role="group" aria-labelledby="f06-notify-title f06-notify-desc"><title id="f06-notify-title">展示具体结论、处理与依据类型 / 脱敏公开必要结果，不删除有效差评</title><desc id="f06-notify-desc">卖家不能删除有效负面反馈。公开评价的证据等级，与是否可提交投诉是两件事。</desc><rect x="300" y="850" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="322" y="877" class="role">04 · 平台通知相关双方</text><text x="322" y="908" class="label" font-size="22"><tspan x="322" dy="0">展示具体结论、处理与依据类型</tspan><tspan x="322" dy="28">脱敏公开必要结果，不删除有效差评</tspan></text></g><g class="node" data-node="f06-appeal" role="group" aria-labelledby="f06-appeal-title f06-appeal-desc"><title id="f06-appeal-title">申诉 / 补证 → 复核 → 维持或改判 / 保留改判、恢复与结案记录</title><desc id="f06-appeal-desc">申诉由有权人员复核；维持或改判都记录原因。纠错后同步相关标签和限制，不静默抹除处理历史。</desc><rect x="300" y="1010" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="322" y="1037" class="role">05 · 当事方与复核人员</text><text x="322" y="1068" class="label" font-size="22"><tspan x="322" dy="0">申诉 / 补证 → 复核 → 维持或改判</tspan><tspan x="322" dy="28">保留改判、恢复与结案记录</tspan></text></g>
<line x1="40" y1="1182" x2="1160" y2="1182" stroke="#F1D8C8"/><text x="40" y="1212" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
