<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1210" width="1200" height="1210" role="img" aria-labelledby="f05-title f05-desc">
<title id="f05-title">05  领养旅程</title><desc id="f05-desc">领养人填写必要申请，救助方沟通并按需补充，双方确认约见。双方可以跳过试养直接进入交接确认，或确认试养约定。双方交接后进行30天回访。可撤回、拒绝、试养失败返回匹配；退养或风险可求助。</desc>
<defs><marker id="f05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="1210" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">05  领养旅程</text><text x="40" y="106" class="subtitle">领养申请独立于买猫预约；试养可选，双方交接与长期回访分别留记录。</text>
<path d="M360 260 V310" class="edge" marker-end="url(#f05-arrow)"/><path d="M360 420 V470" class="edge" marker-end="url(#f05-arrow)"/><path d="M360 580 V630" class="edge" marker-end="url(#f05-arrow)"/><path d="M360 740 V790" class="edge" marker-end="url(#f05-arrow)"/><path d="M360 900 V950" class="edge" marker-end="url(#f05-arrow)"/><path d="M660 365 H840" class="edge dashed" marker-end="url(#f05-arrow)"/><text x="680" y="345" class="edge-label">撤回 / 不匹配</text><path d="M660 525 H770 V685 H840" class="edge dashed" marker-end="url(#f05-arrow)"/><text x="680" y="595" class="edge-label">双方选择直接交接</text><path d="M990 740 V845 H660" class="edge" marker-end="url(#f05-arrow)"/><text x="815" y="825" class="edge-label">跳过试养</text><path d="M660 1005 H840" class="edge dashed" marker-end="url(#f05-arrow)"/><text x="680" y="985" class="edge-label">退养 / 风险信号</text><g class="node" data-node="f05-apply" role="group" aria-labelledby="f05-apply-title f05-apply-desc"><title id="f05-apply-title">浏览详情，填写必要申请 / 了解要求、支出与隐私用途</title><desc id="f05-apply-desc">按阶段收集匹配信息，不默认索取精确住址和证件照片。出售和买猫预约不使用此家庭调查表。</desc><rect x="60" y="150" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="177" class="role">01 · 领养人</text><text x="82" y="208" class="label" font-size="22"><tspan x="82" dy="0">浏览详情，填写必要申请</tspan><tspan x="82" dy="28">了解要求、支出与隐私用途</tspan></text></g><g class="node" data-node="f05-talk" role="group" aria-labelledby="f05-talk-title f05-talk-desc"><title id="f05-talk-title">沟通适配情况，按需补充 / 可以撤回、拒绝或结束申请</title><desc id="f05-talk-desc">只询问必要信息；不匹配有可解释结果，敏感理由不公开。健康声明与费用必须透明。</desc><rect x="60" y="310" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="337" class="role">02 · 救助方与申请人</text><text x="82" y="368" class="label" font-size="22"><tspan x="82" dy="0">沟通适配情况，按需补充</tspan><tspan x="82" dy="28">可以撤回、拒绝或结束申请</tspan></text></g><g class="node" data-node="f05-meet" role="group" aria-labelledby="f05-meet-title f05-meet-desc"><title id="f05-meet-title">约见猫、接待方、时间与地点 / 地点关系已披露，变更重新确认</title><desc id="f05-meet-desc">可在合作医院等第三地点见猫，不要求与照护地址相同；复用版本和变更确认规则。</desc><rect x="60" y="470" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="82" y="497" class="role">03 · 双方明确确认</text><text x="82" y="528" class="label" font-size="22"><tspan x="82" dy="0">约见猫、接待方、时间与地点</tspan><tspan x="82" dy="28">地点关系已披露，变更重新确认</tspan></text></g><g class="node" data-node="f05-trial" role="group" aria-labelledby="f05-trial-title f05-trial-desc"><title id="f05-trial-title">如试养：确认期限、照护与退出 / 试养失败可返回匹配并求助</title><desc id="f05-trial-desc">试养不是所有领养的强制步骤。进入试养前确认异常联系人和承接方式；失败不能自动当作违约或公开羞辱。</desc><rect x="60" y="630" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="657" class="role">04 · 双方可选</text><text x="82" y="688" class="label" font-size="22"><tspan x="82" dy="0">如试养：确认期限、照护与退出</tspan><tspan x="82" dy="28">试养失败可返回匹配并求助</tspan></text></g><g class="node" data-node="f05-handover" role="group" aria-labelledby="f05-handover-title f05-handover-desc"><title id="f05-handover-title">双方确认交接，或有据人工介入 / 同步档案、申请与其他意向状态</title><desc id="f05-handover-desc">单方自报不能等同双方交接。人工介入必须有证据、权限、原因和审计；避免同一猫重复承诺。</desc><rect x="60" y="790" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="82" y="817" class="role">05 · 双方明确确认</text><text x="82" y="848" class="label" font-size="22"><tspan x="82" dy="0">双方确认交接，或有据人工介入</tspan><tspan x="82" dy="28">同步档案、申请与其他意向状态</tspan></text></g><g class="node" data-node="f05-follow" role="group" aria-labelledby="f05-follow-title f05-follow-desc"><title id="f05-follow-title">30 天回访，必要时人工提醒 / 公开安家故事需另行选择</title><desc id="f05-follow-desc">首轮保留可核实的30天回访；7天和90天可扩展。回访与公开故事分开，未公开不影响有效回访。</desc><rect x="60" y="950" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="977" class="role">06 · 领养人与救助方</text><text x="82" y="1008" class="label" font-size="22"><tspan x="82" dy="0">30 天回访，必要时人工提醒</tspan><tspan x="82" dy="28">公开安家故事需另行选择</tspan></text></g><g class="node" data-node="f05-exit" role="group" aria-labelledby="f05-exit-title f05-exit-desc"><title id="f05-exit-title">撤回 / 拒绝 / 求助 / 保留必要处理记录</title><desc id="f05-exit-desc">用户在交接前可以结束匹配。资料权限随申请阶段调整；争议中的必要证据按规则保留。</desc><rect x="840" y="310" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="337" class="role">双方出口</text><text x="862" y="368" class="label" font-size="19"><tspan x="862" dy="0">撤回 / 拒绝 / 求助</tspan><tspan x="862" dy="28">保留必要处理记录</tspan></text></g><g class="node" data-node="f05-direct" role="group" aria-labelledby="f05-direct-title f05-direct-desc"><title id="f05-direct-title">双方不安排试养 / 直接进入交接确认</title><desc id="f05-direct-desc">允许跳过试养，但双方仍需明确交接安排、已知健康情况、照护和异常承接。</desc><rect x="840" y="630" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="862" y="657" class="role">可选路径</text><text x="862" y="688" class="label" font-size="19"><tspan x="862" dy="0">双方不安排试养</tspan><tspan x="862" dy="28">直接进入交接确认</tspan></text></g><g class="node" data-node="f05-help" role="group" aria-labelledby="f05-help-title f05-help-desc"><title id="f05-help-title">联系原救助方与平台 / 协商承接或转入复核</title><desc id="f05-help-desc">退养和风险事件有求助与承接入口，不自动生成售猫或普通送养信息。</desc><rect x="840" y="950" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="977" class="role">异常出口</text><text x="862" y="1008" class="label" font-size="19"><tspan x="862" dy="0">联系原救助方与平台</tspan><tspan x="862" dy="28">协商承接或转入复核</tspan></text></g>
<line x1="40" y1="1152" x2="1160" y2="1152" stroke="#F1D8C8"/><text x="40" y="1182" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
