<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">01  产品全貌</title><desc id="f01-desc">用户从社区、领养或找猫进入。社区和领养为主要服务，找猫辅助提供出售与有偿转让信息。共享档案、分项核验、关系披露、消息、预约与投诉。正常记录回到社区，争议进入复核并可暂停新增预约。</desc>
<defs><marker id="f01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="870" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">01  产品全貌</text><text x="40" y="106" class="subtitle">社区与领养为主，找猫为辅助；三个入口共享具体、有限的信任能力。</text>
<path d="M600 245 V285 H210 V310" class="edge" marker-end="url(#f01-arrow)"/><path d="M600 245 V310" class="edge" marker-end="url(#f01-arrow)"/><path d="M600 245 V285 H990 V310" class="edge" marker-end="url(#f01-arrow)"/><path d="M210 420 V475 H600 V510" class="edge" marker-end="url(#f01-arrow)"/><path d="M600 420 V510" class="edge" marker-end="url(#f01-arrow)"/><path d="M990 420 V475 H600 V510" class="edge" marker-end="url(#f01-arrow)"/><path d="M600 620 V655 H260 V690" class="edge" marker-end="url(#f01-arrow)"/><text x="280" y="650" class="edge-label">双方授权公开</text><path d="M600 620 V655 H940 V690" class="edge dashed" marker-end="url(#f01-arrow)"/><text x="790" y="650" class="edge-label">异常 / 争议</text><g class="node" data-node="f01-goal" role="group" aria-labelledby="f01-goal-title f01-goal-desc"><title id="f01-goal-title">认识可信的人 / 清楚地领养或找猫</title><desc id="f01-goal-desc">已确认定位：交流与领养为主，交易次要。允许个人、商家、猫舍和公开关系的代理参与。</desc><rect x="430" y="135" width="340" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="452" y="162" class="role">用户目标</text><text x="452" y="193" class="label" font-size="19"><tspan x="452" dy="0">认识可信的人</tspan><tspan x="452" dy="28">清楚地领养或找猫</tspan></text></g><g class="node" data-node="f01-community" role="group" aria-labelledby="f01-community-title f01-community-desc"><title id="f01-community-title">日常交流 · 养宠互助 / 救助与安家故事</title><desc id="f01-community-desc">内容可关联稳定猫咪档案；故事和评价不替代材料核验，公开家庭信息须另行授权。</desc><rect x="40" y="310" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="337" class="role">主要入口 · 社区</text><text x="62" y="368" class="label" font-size="19"><tspan x="62" dy="0">日常交流 · 养宠互助</tspan><tspan x="62" dy="28">救助与安家故事</tspan></text></g><g class="node" data-node="f01-adoption" role="group" aria-labelledby="f01-adoption-title f01-adoption-desc"><title id="f01-adoption-title">发现 → 申请 → 交接 / 约见、试养与回访</title><desc id="f01-adoption-desc">领养使用独立申请和交接流程；试养可选，合理支出需透明披露，不能隐藏售猫或捆绑消费。</desc><rect x="430" y="310" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="452" y="337" class="role">主要入口 · 领养</text><text x="452" y="368" class="label" font-size="19"><tspan x="452" dy="0">发现 → 申请 → 交接</tspan><tspan x="452" dy="28">约见、试养与回访</tspan></text></g><g class="node" data-node="f01-buy" role="group" aria-labelledby="f01-buy-title f01-buy-desc"><title id="f01-buy-title">出售 / 有偿转让 / 披露 → 预约 → 反馈</title><desc id="f01-buy-desc">商业性质在列表与详情持续可见。首版不代收猫款属于规划假设，不是已批准的完整交易服务。</desc><rect x="820" y="310" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="842" y="337" class="role">辅助入口 · 找猫</text><text x="842" y="368" class="label" font-size="19"><tspan x="842" dy="0">出售 / 有偿转让</tspan><tspan x="842" dy="28">披露 → 预约 → 反馈</tspan></text></g><g class="node" data-node="f01-shared" role="group" aria-labelledby="f01-shared-title f01-shared-desc"><title id="f01-shared-title">主体 / 授权 / 单猫档案 / 关系与费用披露 / 分项核验 · 上下文消息 · 预约版本 · 投诉复核</title><desc id="f01-shared-desc">核验结果按对象、事项、方法、时间和版本展示；主体可以不同，已披露关系和授权需要清楚。</desc><rect x="220" y="510" width="760" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="242" y="537" class="role">共享能力 · 平台与双方</text><text x="242" y="568" class="label" font-size="22"><tspan x="242" dy="0">主体 / 授权 / 单猫档案 / 关系与费用披露</tspan><tspan x="242" dy="28">分项核验 · 上下文消息 · 预约版本 · 投诉复核</tspan></text></g><g class="node" data-node="f01-feedback" role="group" aria-labelledby="f01-feedback-title f01-feedback-desc"><title id="f01-feedback-title">到访反馈 / 30 天回访 / 可选择生成脱敏故事</title><desc id="f01-feedback-desc">领养回访和买猫到访反馈分别统计；未反馈不计为信息一致，公开故事必须经用户主动选择。</desc><rect x="40" y="690" width="440" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="717" class="role">正常结果 · 用户选择</text><text x="62" y="748" class="label" font-size="22"><tspan x="62" dy="0">到访反馈 / 30 天回访</tspan><tspan x="62" dy="28">可选择生成脱敏故事</tspan></text></g><g class="node" data-node="f01-exception" role="group" aria-labelledby="f01-exception-title f01-exception-desc"><title id="f01-exception-title">拒绝 / 退出 / 举报 / 必要时暂停，允许补充与申诉</title><desc id="f01-exception-desc">任何入口均可举报。没有预约码也可受理；举报量和单方陈述不会直接产生骗子标签。</desc><rect x="720" y="690" width="440" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="742" y="717" class="role">异常出口 · 用户与运营</text><text x="742" y="748" class="label" font-size="22"><tspan x="742" dy="0">拒绝 / 退出 / 举报</tspan><tspan x="742" dy="28">必要时暂停，允许补充与申诉</tspan></text></g>
<line x1="40" y1="812" x2="1160" y2="812" stroke="#F1D8C8"/><text x="40" y="842" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
