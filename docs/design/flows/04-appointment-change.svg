<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">04  预约关键变更</title><desc id="f04-desc">保留旧版已确认快照。猫、时间、地点、接待方、费用、预计收款、代理、已知健康或交接售后责任变化，生成新版本并暂停旧安排。双方查看差异后接受、拒绝或待确认；明确截止时间后未回复则到期失效，不恢复旧地址。新安排或恢复原安排均需双确认，拒绝不计失约。</desc>
<defs><marker id="f04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="1050" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">04  预约关键变更</text><text x="40" y="106" class="subtitle">待确认变更期间旧安排暂停；新安排或恢复原安排，均须双方明确确认。</text>
<path d="M360 260 V310" class="edge" marker-end="url(#f04-arrow)"/><path d="M360 420 V470" class="edge" marker-end="url(#f04-arrow)"/><path d="M360 580 V630" class="edge" marker-end="url(#f04-arrow)"/><path d="M360 740 V790" class="edge" marker-end="url(#f04-arrow)"/><text x="375" y="770" class="edge-label">双方接受同一版本</text><path d="M660 365 H840" class="edge" marker-end="url(#f04-arrow)"/><text x="690" y="345" class="edge-label">旧记录保留</text><path d="M660 685 H840" class="edge dashed" marker-end="url(#f04-arrow)"/><text x="700" y="665" class="edge-label">明确拒绝</text><path d="M660 705 H770 V845 H840" class="edge dashed" marker-end="url(#f04-arrow)"/><text x="690" y="765" class="edge-label">未回复 / 超时</text><g class="node" data-node="f04-old" role="group" aria-labelledby="f04-old-title f04-old-desc"><title id="f04-old-title">保留已确认快照 v1 / 猫、主体、地点、费用、责任与确认时间</title><desc id="f04-old-desc">v1 不可静默编辑。即使出现新方案，旧声明、确认、聊天和变更记录仍可用于查询与争议。</desc><rect x="60" y="150" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="177" class="role">01 · 系统与双方</text><text x="82" y="208" class="label" font-size="22"><tspan x="82" dy="0">保留已确认快照 v1</tspan><tspan x="82" dy="28">猫、主体、地点、费用、责任与确认时间</tspan></text></g><g class="node" data-node="f04-new" role="group" aria-labelledby="f04-new-title f04-new-desc"><title id="f04-new-title">提出 v2，原版本与提案分列 / 猫 / 人 / 地 / 价 / 健康 / 责任等</title><desc id="f04-new-desc">关键变更包括猫、时间、地点、接待方、总价与必付项、预计收款方、代理关系、新增已知健康情况、健康声明纠正和交接售后责任条款。普通改约保留原有效版本；地点不可用、主体／宠物不符或健康重大纠正等安全风险另走safety_hold，明确先不出发。平台不能物理阻止转场。</desc><rect x="60" y="310" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="337" class="role">02 · 变更提出方</text><text x="82" y="368" class="label" font-size="22"><tspan x="82" dy="0">提出 v2，原版本与提案分列</tspan><tspan x="82" dy="28">猫 / 人 / 地 / 价 / 健康 / 责任等</tspan></text></g><g class="node" data-node="f04-diff" role="group" aria-labelledby="f04-diff-title f04-diff-desc"><title id="f04-diff-title">逐项显示旧值 → 新值 / 提示实际影响与下一步</title><desc id="f04-diff-desc">差异覆盖猫、接待主体、预约地点、费用与代理，以及新增健康情况、健康声明纠正和交接售后责任；不藏在长条款中。</desc><rect x="60" y="470" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="82" y="497" class="role">03 · 系统向双方展示</text><text x="82" y="528" class="label" font-size="22"><tspan x="82" dy="0">逐项显示旧值 → 新值</tspan><tspan x="82" dy="28">提示实际影响与下一步</tspan></text></g><g class="node" data-node="f04-decision" role="group" aria-labelledby="f04-decision-title f04-decision-desc"><title id="f04-decision-title">接受 / 拒绝 / 提议改约 / 未回复继续待确认</title><desc id="f04-decision-desc">聊天文本、已读和超时不代替关键确认；过时版本提交应要求刷新，而不能覆盖新条款。</desc><rect x="60" y="630" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="82" y="657" class="role">04 · 双方各自选择</text><text x="82" y="688" class="label" font-size="22"><tspan x="82" dy="0">接受 / 拒绝 / 提议改约</tspan><tspan x="82" dy="28">未回复继续待确认</tspan></text></g><g class="node" data-node="f04-accepted" role="group" aria-labelledby="f04-accepted-title f04-accepted-desc"><title id="f04-accepted-title">仅双方接受 v2 后确认新安排 / 后续到访反馈关联实际确认版本</title><desc id="f04-accepted-desc">新安排可执行的产品状态要求双方明确确认同一版本。再次变更重复此流程，不复用旧确认。</desc><rect x="60" y="790" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="817" class="role">05 · 系统</text><text x="82" y="848" class="label" font-size="22"><tspan x="82" dy="0">仅双方接受 v2 后确认新安排</tspan><tspan x="82" dy="28">后续到访反馈关联实际确认版本</tspan></text></g><g class="node" data-node="f04-retain" role="group" aria-labelledby="f04-retain-title f04-retain-desc"><title id="f04-retain-title">v1 不覆盖新安排 / 记录始终可查询</title><desc id="f04-retain-desc">普通改约保留原有效安排，提案不覆盖它；安全风险暂停后不能靠拒绝、撤回或超时恢复，须核对并双方确认新有效版本。</desc><rect x="840" y="310" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="337" class="role">版本边界</text><text x="862" y="368" class="label" font-size="19"><tspan x="862" dy="0">v1 不覆盖新安排</tspan><tspan x="862" dy="28">记录始终可查询</tspan></text></g><g class="node" data-node="f04-decline" role="group" aria-labelledby="f04-decline-title f04-decline-desc"><title id="f04-decline-title">拒绝 / 取消 / 举报 / 不计无故失约</title><desc id="f04-decline-desc">用户因新条件不接受而退出，不降低买家信誉。可以报告未确认转场、加价或隐藏关系。</desc><rect x="840" y="630" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="657" class="role">用户出口</text><text x="862" y="688" class="label" font-size="19"><tspan x="862" dy="0">拒绝 / 取消 / 举报</tspan><tspan x="862" dy="28">不计无故失约</tspan></text></g><g class="node" data-node="f04-pending" role="group" aria-labelledby="f04-pending-title f04-pending-desc"><title id="f04-pending-title">明确截止时间后失效 / 绝不默认同意</title><desc id="f04-pending-desc">未回复保持待确认；普通提案超过截止时间标记expired，仅结束提案，不自动接受新安排；安全暂停不因超时解除。恢复旧内容也新建提案并双确认。</desc><rect x="840" y="790" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="817" class="role">等待出口</text><text x="862" y="848" class="label" font-size="19"><tspan x="862" dy="0">明确截止时间后失效</tspan><tspan x="862" dy="28">绝不默认同意</tspan></text></g>
<line x1="40" y1="992" x2="1160" y2="992" stroke="#F1D8C8"/><text x="40" y="1022" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
