<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">02  找猫用户旅程</title><desc id="f02-desc">买家浏览单猫详情，核对关系、核验范围和完整费用；双方确认同一预约版本后赴约，分别记录到访结果。资料不充分可以退出；关键变更重新确认；不符或不确定可举报。可不成交，交接需另行确认。</desc>
<defs><marker id="f02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="1040" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">02  找猫用户旅程</text><text x="40" y="106" class="subtitle">看清具体猫、主体关系、地点与完整费用，再决定是否赴约；每一步都可退出。</text>
<path d="M360 260 V310" class="edge" marker-end="url(#f02-arrow)"/><path d="M360 420 V470" class="edge" marker-end="url(#f02-arrow)"/><path d="M360 580 V630" class="edge" marker-end="url(#f02-arrow)"/><path d="M360 740 V790" class="edge" marker-end="url(#f02-arrow)"/><path d="M660 365 H840" class="edge dashed" marker-end="url(#f02-arrow)"/><text x="690" y="350" class="edge-label">不充分 / 不接受</text><path d="M660 525 H770 V685 H840" class="edge dashed" marker-end="url(#f02-arrow)"/><text x="690" y="595" class="edge-label">关键安排变化</text><path d="M660 685 H800 V845 H840" class="edge dashed" marker-end="url(#f02-arrow)"/><text x="680" y="765" class="edge-label">不符 / 不确定</text><g class="node" data-node="f02-detail" role="group" aria-labelledby="f02-detail-title f02-detail-desc"><title id="f02-detail-title">浏览单猫详情与商业性质 / 确认猫的稳定标识与当前状态</title><desc id="f02-detail-desc">出售或有偿转让明确标注。代表照片与近期材料关联具体猫；不可预约时显示原因，不使用其他猫引流。</desc><rect x="60" y="150" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="177" class="role">01 · 买家</text><text x="82" y="208" class="label" font-size="22"><tspan x="82" dy="0">浏览单猫详情与商业性质</tspan><tspan x="82" dy="28">确认猫的稳定标识与当前状态</tspan></text></g><g class="node" data-node="f02-disclosure" role="group" aria-labelledby="f02-disclosure-title f02-disclosure-desc"><title id="f02-disclosure-title">查看发布 / 照护 / 代理 / 接待关系 / 核对核验范围、报价与全部必付项</title><desc id="f02-disclosure-desc">先看具体报价、必付项目、总额、预计收款方与责任方。材料已上传不等于来源已确认；预计收款为卖家声明。</desc><rect x="60" y="310" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="337" class="role">02 · 买家</text><text x="82" y="368" class="label" font-size="22"><tspan x="82" dy="0">查看发布 / 照护 / 代理 / 接待关系</tspan><tspan x="82" dy="28">核对核验范围、报价与全部必付项</tspan></text></g><g class="node" data-node="f02-confirm" role="group" aria-labelledby="f02-confirm-title f02-confirm-desc"><title id="f02-confirm-title">同一版本：猫、接待方、时间、地点 / 费用、代理关系、责任与健康声明</title><desc id="f02-confirm-desc">只有双方确认同一版本才是已确认预约。聊天里说好的、未回复或超时均不代替明确确认。</desc><rect x="60" y="470" width="600" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="82" y="497" class="role">03 · 双方明确确认</text><text x="82" y="528" class="label" font-size="22"><tspan x="82" dy="0">同一版本：猫、接待方、时间、地点</tspan><tspan x="82" dy="28">费用、代理关系、责任与健康声明</tspan></text></g><g class="node" data-node="f02-visit" role="group" aria-labelledby="f02-visit-title f02-visit-desc"><title id="f02-visit-title">按已确认安排到访，分别反馈 / 猫 / 身份 / 地点 / 费用分项判断</title><desc id="f02-visit-desc">每项可选一致、不一致或不确定。到访码仅关联预约，不独立证明到场；未成交也可反馈一致。</desc><rect x="60" y="630" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="657" class="role">04 · 买家与接待方</text><text x="82" y="688" class="label" font-size="22"><tspan x="82" dy="0">按已确认安排到访，分别反馈</tspan><tspan x="82" dy="28">猫 / 身份 / 地点 / 费用分项判断</tspan></text></g><g class="node" data-node="f02-handover" role="group" aria-labelledby="f02-handover-title f02-handover-desc"><title id="f02-handover-title">决定不买，或另行确认交接 / 保留原预约与实际结果</title><desc id="f02-handover-desc">到访不会自动生成成交或付款确认。卖家自报、双方交接确认和支付凭据是不同依据，分别记录。</desc><rect x="60" y="790" width="600" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="82" y="817" class="role">05 · 双方可选</text><text x="82" y="848" class="label" font-size="22"><tspan x="82" dy="0">决定不买，或另行确认交接</tspan><tspan x="82" dy="28">保留原预约与实际结果</tspan></text></g><g class="node" data-node="f02-leave" role="group" aria-labelledby="f02-leave-title f02-leave-desc"><title id="f02-leave-title">继续咨询 / 拒绝预约 / 无需先付费才能核对</title><desc id="f02-leave-desc">对资料、报价或安排不接受即可退出；不强制买家填写领养家庭调查。</desc><rect x="840" y="310" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="337" class="role">买家出口</text><text x="862" y="368" class="label" font-size="19"><tspan x="862" dy="0">继续咨询 / 拒绝预约</tspan><tspan x="862" dy="28">无需先付费才能核对</tspan></text></g><g class="node" data-node="f02-change" role="group" aria-labelledby="f02-change-title f02-change-desc"><title id="f02-change-title">新版本 → 差异确认 / 拒绝不计无故失约</title><desc id="f02-change-desc">任何换猫、换店、换接待方、加价或代理关系变化均需重新确认；旧确认不覆盖新安排。</desc><rect x="840" y="630" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="657" class="role">双方变更</text><text x="862" y="688" class="label" font-size="19"><tspan x="862" dy="0">新版本 → 差异确认</tspan><tspan x="862" dy="28">拒绝不计无故失约</tspan></text></g><g class="node" data-node="f02-report" role="group" aria-labelledby="f02-report-title f02-report-desc"><title id="f02-report-title">退出 / 提交不符反馈 / 可向平台举报复核</title><desc id="f02-report-desc">不要求先成交或拥有到访码；保留预约版本与必要证据，平台调查后区分报告获支持、未获支持与无法判断。</desc><rect x="840" y="790" width="300" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="862" y="817" class="role">买家出口</text><text x="862" y="848" class="label" font-size="19"><tspan x="862" dy="0">退出 / 提交不符反馈</tspan><tspan x="862" dy="28">可向平台举报复核</tspan></text></g>
<line x1="40" y1="982" x2="1160" y2="982" stroke="#F1D8C8"/><text x="40" y="1012" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
