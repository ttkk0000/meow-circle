<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" width="1200" height="1170" role="img" aria-labelledby="f07-title f07-desc">
<title id="f07-title">07  核验能证明什么</title><desc id="f07-desc">主体材料仅支持账号与所核对主体关联；授权支持具体权限；近期视频支持近期接触所示猫与环境；场所材料支持所声明地点和关系；医疗上传与来源确认分别表述。任何一项都不能生成全局真实、无中介或健康保证。过期、撤权和关键变化触发复核。</desc>
<defs><marker id="f07-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B5E57"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#231F20}.heading{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#6B5E57}.role{font-size:16px;fill:#6B5E57}.label{font-weight:600}.edge{fill:none;stroke:#6B5E57;stroke-width:2.5}.dashed{stroke-dasharray:8 6}.edge-label{font-size:16px;paint-order:stroke;stroke:#FFF8F2;stroke-width:7;stroke-linejoin:round}.foot{font-size:16px;fill:#6B5E57}</style>
<rect width="1200" height="1170" fill="#FFF8F2"/><rect x="40" y="34" width="8" height="42" rx="4" fill="#FF8A3D"/><text x="66" y="66" class="heading">07  核验能证明什么</text><text x="40" y="106" class="subtitle">每个结论都有对象、范围、时间与版本；材料不跨越到它没有证明的事实。</text>
<text x="40" y="155" class="role">证据 / 核验对象</text><text x="400" y="155" class="role">可表达的有限结论</text><text x="800" y="155" class="role">不能推断</text><path d="M340 235 H390" class="edge" marker-end="url(#f07-arrow)"/><path d="M750 235 H790" class="edge dashed" marker-end="url(#f07-arrow)"/><g class="node" data-node="f07-source-0" role="group" aria-labelledby="f07-source-0-title f07-source-0-desc"><title id="f07-source-0-title">主体材料</title><desc id="f07-source-0-desc">核对对象为账号与提交主体材料；主体类别不代表可信程度。</desc><rect x="40" y="180" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="207" class="role">具体材料</text><text x="62" y="238" class="label" font-size="19"><tspan x="62" dy="0">主体材料</tspan></text></g><g class="node" data-node="f07-scope-0" role="group" aria-labelledby="f07-scope-0-title f07-scope-0-desc"><title id="f07-scope-0-title">账号与提交主体相符</title><desc id="f07-scope-0-desc">核对对象为账号与提交主体材料；主体类别不代表可信程度。</desc><rect x="390" y="180" width="360" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="412" y="207" class="role">按对象 / 范围 / 时间</text><text x="412" y="238" class="label" font-size="22"><tspan x="412" dy="0">账号与提交主体相符</tspan></text></g><g class="node" data-node="f07-limit-0" role="group" aria-labelledby="f07-limit-0-title f07-limit-0-desc"><title id="f07-limit-0-title">不证明猫的所有权</title><desc id="f07-limit-0-desc">核对对象为账号与提交主体材料；主体类别不代表可信程度。</desc><rect x="790" y="180" width="370" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="812" y="207" class="role">结论边界</text><text x="812" y="238" class="label" font-size="22"><tspan x="812" dy="0">不证明猫的所有权</tspan></text></g><path d="M340 385 H390" class="edge" marker-end="url(#f07-arrow)"/><path d="M750 385 H790" class="edge dashed" marker-end="url(#f07-arrow)"/><g class="node" data-node="f07-source-1" role="group" aria-labelledby="f07-source-1-title f07-source-1-desc"><title id="f07-source-1-title">发布 / 接待授权</title><desc id="f07-source-1-desc">授权范围、对象和期限要具体；员工、代理和责任主体可以不同。</desc><rect x="40" y="330" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="357" class="role">具体材料</text><text x="62" y="388" class="label" font-size="19"><tspan x="62" dy="0">发布 / 接待授权</tspan></text></g><g class="node" data-node="f07-scope-1" role="group" aria-labelledby="f07-scope-1-title f07-scope-1-desc"><title id="f07-scope-1-title">具体事项与权限已核对</title><desc id="f07-scope-1-desc">授权范围、对象和期限要具体；员工、代理和责任主体可以不同。</desc><rect x="390" y="330" width="360" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="412" y="357" class="role">按对象 / 范围 / 时间</text><text x="412" y="388" class="label" font-size="22"><tspan x="412" dy="0">具体事项与权限已核对</tspan></text></g><g class="node" data-node="f07-limit-1" role="group" aria-labelledby="f07-limit-1-title f07-limit-1-desc"><title id="f07-limit-1-title">不证明所有后续代售合法</title><desc id="f07-limit-1-desc">授权范围、对象和期限要具体；员工、代理和责任主体可以不同。</desc><rect x="790" y="330" width="370" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="812" y="357" class="role">结论边界</text><text x="812" y="388" class="label" font-size="22"><tspan x="812" dy="0">不证明所有后续代售合法</tspan></text></g><path d="M340 535 H390" class="edge" marker-end="url(#f07-arrow)"/><path d="M750 535 H790" class="edge dashed" marker-end="url(#f07-arrow)"/><g class="node" data-node="f07-source-2" role="group" aria-labelledby="f07-source-2-title f07-source-2-desc"><title id="f07-source-2-title">近期猫咪视频</title><desc id="f07-source-2-desc">随机任务、日期和单猫关联可降低盗图风险；不能证明家庭饲养或所有权。</desc><rect x="40" y="480" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="507" class="role">具体材料</text><text x="62" y="538" class="label" font-size="19"><tspan x="62" dy="0">近期猫咪视频</tspan></text></g><g class="node" data-node="f07-scope-2" role="group" aria-labelledby="f07-scope-2-title f07-scope-2-desc"><title id="f07-scope-2-title">近期接触所示猫与环境</title><desc id="f07-scope-2-desc">随机任务、日期和单猫关联可降低盗图风险；不能证明家庭饲养或所有权。</desc><rect x="390" y="480" width="360" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="412" y="507" class="role">按对象 / 范围 / 时间</text><text x="412" y="538" class="label" font-size="22"><tspan x="412" dy="0">近期接触所示猫与环境</tspan></text></g><g class="node" data-node="f07-limit-2" role="group" aria-labelledby="f07-limit-2-title f07-limit-2-desc"><title id="f07-limit-2-title">不证明来源、无中介或无病</title><desc id="f07-limit-2-desc">随机任务、日期和单猫关联可降低盗图风险；不能证明家庭饲养或所有权。</desc><rect x="790" y="480" width="370" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="812" y="507" class="role">结论边界</text><text x="812" y="538" class="label" font-size="22"><tspan x="812" dy="0">不证明来源、无中介或无病</tspan></text></g><path d="M340 685 H390" class="edge" marker-end="url(#f07-arrow)"/><path d="M750 685 H790" class="edge dashed" marker-end="url(#f07-arrow)"/><g class="node" data-node="f07-source-3" role="group" aria-labelledby="f07-source-3-title f07-source-3-desc"><title id="f07-source-3-title">场所与关系材料</title><desc id="f07-source-3-desc">合作医院、门店和照护地点可以不同，关键在于披露和预约确认。</desc><rect x="40" y="630" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="657" class="role">具体材料</text><text x="62" y="688" class="label" font-size="19"><tspan x="62" dy="0">场所与关系材料</tspan></text></g><g class="node" data-node="f07-scope-3" role="group" aria-labelledby="f07-scope-3-title f07-scope-3-desc"><title id="f07-scope-3-title">支持已声明场所及关系</title><desc id="f07-scope-3-desc">合作医院、门店和照护地点可以不同，关键在于披露和预约确认。</desc><rect x="390" y="630" width="360" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="412" y="657" class="role">按对象 / 范围 / 时间</text><text x="412" y="688" class="label" font-size="22"><tspan x="412" dy="0">支持已声明场所及关系</tspan></text></g><g class="node" data-node="f07-limit-3" role="group" aria-labelledby="f07-limit-3-title f07-limit-3-desc"><title id="f07-limit-3-title">不等于平台实地巡检</title><desc id="f07-limit-3-desc">合作医院、门店和照护地点可以不同，关键在于披露和预约确认。</desc><rect x="790" y="630" width="370" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="812" y="657" class="role">结论边界</text><text x="812" y="688" class="label" font-size="22"><tspan x="812" dy="0">不等于平台实地巡检</tspan></text></g><path d="M340 835 H390" class="edge" marker-end="url(#f07-arrow)"/><path d="M750 835 H790" class="edge dashed" marker-end="url(#f07-arrow)"/><g class="node" data-node="f07-source-4" role="group" aria-labelledby="f07-source-4-title f07-source-4-desc"><title id="f07-source-4-title">医疗文件</title><desc id="f07-source-4-desc">上传仅说明文件存在；向出具方确认也只支持指定材料，不构成全生命周期健康保证。</desc><rect x="40" y="780" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#6B5E57" stroke-width="2"/><text x="62" y="807" class="role">具体材料</text><text x="62" y="838" class="label" font-size="19"><tspan x="62" dy="0">医疗文件</tspan></text></g><g class="node" data-node="f07-scope-4" role="group" aria-labelledby="f07-scope-4-title f07-scope-4-desc"><title id="f07-scope-4-title">区分上传与出具来源确认</title><desc id="f07-scope-4-desc">上传仅说明文件存在；向出具方确认也只支持指定材料，不构成全生命周期健康保证。</desc><rect x="390" y="780" width="360" height="110" rx="8" fill="#FFF7D6" stroke="#6B5E57" stroke-width="2"/><text x="412" y="807" class="role">按对象 / 范围 / 时间</text><text x="412" y="838" class="label" font-size="22"><tspan x="412" dy="0">区分上传与出具来源确认</tspan></text></g><g class="node" data-node="f07-limit-4" role="group" aria-labelledby="f07-limit-4-title f07-limit-4-desc"><title id="f07-limit-4-title">不保证当前或未来无病</title><desc id="f07-limit-4-desc">上传仅说明文件存在；向出具方确认也只支持指定材料，不构成全生命周期健康保证。</desc><rect x="790" y="780" width="370" height="110" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="812" y="807" class="role">结论边界</text><text x="812" y="838" class="label" font-size="22"><tspan x="812" dy="0">不保证当前或未来无病</tspan></text></g><path d="M600 890 V940" class="edge dashed" marker-end="url(#f07-arrow)"/><text x="620" y="922" class="edge-label">证据过期 / 撤权 / 关键变化</text><g class="node" data-node="f07-invalidate" role="group" aria-labelledby="f07-invalidate-title f07-invalidate-desc"><title id="f07-invalidate-title">标记过期 / 撤销 / 争议 → 说明影响 → 补充复核或限制新增预约 / 无总括「真实」「无中介」「健康保证」认证</title><desc id="f07-invalidate-desc">每项结论记录对象、事项、方法、时间、来源或审核人、有效状态和适用版本。旧结论不能自动覆盖新猫、新地点或新代理关系。</desc><rect x="40" y="940" width="1120" height="130" rx="8" fill="#FFF1E6" stroke="#9B3913" stroke-width="2"/><text x="62" y="967" class="role">异常路径 · 平台与发布者</text><text x="62" y="998" class="label" font-size="22"><tspan x="62" dy="0">标记过期 / 撤销 / 争议 → 说明影响 → 补充复核或限制新增预约</tspan><tspan x="62" dy="28">无总括「真实」「无中介」「健康保证」认证</tspan></text></g>
<line x1="40" y1="1112" x2="1160" y2="1112" stroke="#F1D8C8"/><text x="40" y="1142" class="foot">M&amp;D / meow &amp; doggie · 2026-10-15 · 待实施流程文档；节点均为拟议业务规则</text>
</svg>
