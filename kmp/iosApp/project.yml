name: MndIOS

options:
  bundleIdPrefix: com.ttkk0000.meowcircle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MND_API_BASE_URL: "http://127.0.0.1:8080"
    MND_AMAP_IOS_KEY: ""
    MND_TERMS_URL: ""
    MND_PRIVACY_URL: ""
    MND_WECHAT_IOS_APP_ID: "wx0000000000000000"
    MND_QQ_IOS_APP_ID: "00000000"
    MND_WECHAT_UNIVERSAL_LINK: "https://example.invalid/oauth/wechat/"
    MND_QQ_UNIVERSAL_LINK: "https://example.invalid/oauth/qq/"
    MND_APPLE_SIGNIN_ENABLED: "NO"
    MND_APNS_ENABLED: "NO"
    MND_PROVIDER_ASSOCIATED_DOMAIN: "example.invalid"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MndIOS:
    type: application
    platform: iOS
    sources:
      - path: ComposeApp
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "M&D"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CADisableMinimumFrameDurationOnPhone: true
        UIDeviceFamily: [1, 2]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        MND_API_BASE_URL: $(MND_API_BASE_URL)
        MND_AMAP_IOS_KEY: $(MND_AMAP_IOS_KEY)
        MND_TERMS_URL: $(MND_TERMS_URL)
        MND_PRIVACY_URL: $(MND_PRIVACY_URL)
        MND_WECHAT_IOS_APP_ID: $(MND_WECHAT_IOS_APP_ID)
        MND_QQ_IOS_APP_ID: $(MND_QQ_IOS_APP_ID)
        MND_WECHAT_UNIVERSAL_LINK: $(MND_WECHAT_UNIVERSAL_LINK)
        MND_QQ_UNIVERSAL_LINK: $(MND_QQ_UNIVERSAL_LINK)
        MND_APPLE_SIGNIN_ENABLED: $(MND_APPLE_SIGNIN_ENABLED)
        MND_APNS_ENABLED: $(MND_APNS_ENABLED)
        LSApplicationQueriesSchemes: [weixin, weixinULAPI, mqq, mqqapi, mqqopensdkapiV2, mqqopensdkapiV3, tim]
        CFBundleURLTypes:
          - CFBundleURLName: mnd-task
            CFBundleURLSchemes: [mnd]
          - CFBundleURLName: wechat
            CFBundleURLSchemes: [$(MND_WECHAT_IOS_APP_ID)]
          - CFBundleURLName: qq
            CFBundleURLSchemes: [tencent$(MND_QQ_IOS_APP_ID)]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        MND_ENTITLEMENTS_FILE: ComposeApp/MndBase.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MND_ENTITLEMENTS_FILE)
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ComposeApp/MndProviderBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: com.ttkk0000.meowcircle.ios
        PRODUCT_NAME: "M&D"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../iosUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    preBuildScripts:
      - name: Build Compose iOS framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle invocation because the IDE build override is active"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :iosUi:embedAndSignAppleFrameworkForXcode
    dependencies:
      - framework: ../iosUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/MndMobileUI.framework
        embed: false

schemes:
  MndIOS:
    build:
      targets:
        MndIOS: all
    run:
      config: Debug
    archive:
      config: Release
