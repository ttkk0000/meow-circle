name: MndIOS

options:
  bundleIdPrefix: com.ttkk0000.meowcircle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MND_API_BASE_URL: "http://127.0.0.1:8080"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MndIOS:
    type: application
    platform: iOS
    sources:
      - path: ComposeApp
    info:
      path: MndIOS/Info.plist
      properties:
        CFBundleDisplayName: "M&D"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CADisableMinimumFrameDurationOnPhone: true
        UIDeviceFamily: [1, 2]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        MND_API_BASE_URL: $(MND_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ttkk0000.meowcircle.ios
        PRODUCT_NAME: "M&D"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../iosUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    preBuildScripts:
      - name: Build Compose iOS framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle invocation because the IDE build override is active"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :iosUi:embedAndSignAppleFrameworkForXcode
    dependencies:
      - framework: ../iosUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/MndMobileUI.framework
        embed: false

schemes:
  MndIOS:
    build:
      targets:
        MndIOS: all
    run:
      config: Debug
    archive:
      config: Release
