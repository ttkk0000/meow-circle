services:
  postgres:
    image: postgres:16-alpine
    container_name: meow-postgres
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meowpass
      POSTGRES_DB: meow
    ports:
      - "5432:5432"
    volumes:
      - meow_pg:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_social.sql:/docker-entrypoint-initdb.d/002_social.sql:ro
      - ./migrations/003_user_phone.sql:/docker-entrypoint-initdb.d/003_user_phone.sql:ro
      - ./migrations/004_notifications_actor_image.sql:/docker-entrypoint-initdb.d/004_notifications_actor_image.sql:ro
      - ./migrations/005_adoption.sql:/docker-entrypoint-initdb.d/005_adoption.sql:ro
      - ./migrations/006_listing_category.sql:/docker-entrypoint-initdb.d/006_listing_category.sql:ro
      - ./migrations/007_mobile_modules.sql:/docker-entrypoint-initdb.d/007_mobile_modules.sql:ro
      - ./migrations/008_mobile_policy_commands.sql:/docker-entrypoint-initdb.d/008_mobile_policy_commands.sql:ro
      - ./migrations/009_pet_discussions.sql:/docker-entrypoint-initdb.d/009_pet_discussions.sql:ro
      - ./migrations/010_operations_console.sql:/docker-entrypoint-initdb.d/010_operations_console.sql:ro
      - ./migrations/011_mobile_query_indexes.sql:/docker-entrypoint-initdb.d/011_mobile_query_indexes.sql:ro
      - ./migrations/012_worker_checkpoints.sql:/docker-entrypoint-initdb.d/012_worker_checkpoints.sql:ro
      - ./migrations/013_source_declarations.sql:/docker-entrypoint-initdb.d/013_source_declarations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meow -d meow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - meow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meow_pg:
  meow_redis:
